<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 가장 좋아하는 하루</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #3f3a4b;
            font-family:
                "Arial Rounded MT Bold",
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                sans-serif;
            background:
                radial-gradient(circle at 16% 12%,
                    rgba(255, 255, 255, 0.7) 0 2px,
                    transparent 3px),
                #f8edca;
            background-size: 23px 23px;
        }

        .page {
            position: relative;
            min-height: 100vh;
            padding: 40px 30px 70px;
            overflow: hidden;
        }

        /* 종이 공예 배경 */
        .sun {
            position: fixed;
            top: 5%;
            right: 5%;
            z-index: -1;
            width: 100px;
            height: 100px;
            border-radius: 48% 52% 44% 56%;
            background: #f7b951;
            box-shadow:
                0 12px 0 #d99b37,
                0 22px 20px rgba(74, 61, 46, 0.16);
            transform: rotate(8deg);
        }

        .hill {
            position: fixed;
            bottom: -100px;
            z-index: -1;
            width: 55%;
            height: 300px;
            filter: drop-shadow(0 14px 12px rgba(70, 62, 55, 0.12));
        }

        .hill-left {
            left: -10%;
            background: #b9dbc7;
            clip-path: polygon(0 35%,
                    20% 15%,
                    40% 35%,
                    60% 8%,
                    80% 32%,
                    100% 15%,
                    100% 100%,
                    0 100%);
        }

        .hill-right {
            right: -12%;
            background: #9fc8b4;
            clip-path: polygon(0 30%,
                    25% 8%,
                    48% 34%,
                    70% 12%,
                    100% 35%,
                    100% 100%,
                    0 100%);
        }

        .container {
            width: min(1440px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 38px;
            text-align: center;
        }

        h1 {
            display: inline-block;
            margin: 0;
            padding: 18px 42px;
            color: #58639b;
            font-size: clamp(34px, 5vw, 66px);
            font-weight: 900;
            letter-spacing: -4px;
            background: #fff9e8;
            border-radius: 18px 14px 20px 13px;
            box-shadow:
                0 9px 0 #e4d8b8,
                0 18px 30px rgba(72, 65, 59, 0.18);
            transform: rotate(-1deg);
            clip-path: polygon(1% 4%,
                    99% 0,
                    98% 96%,
                    2% 100%,
                    0 48%);
        }

        .guide {
            width: fit-content;
            margin: 22px auto 0;
            padding: 10px 22px;
            color: #4e654f;
            font-size: 18px;
            font-weight: 800;
            background: #cce3c3;
            border-radius: 5px 12px 6px 13px;
            box-shadow:
                0 6px 0 #a9c39f,
                0 10px 16px rgba(72, 65, 59, 0.12);
            transform: rotate(0.5deg);
        }

        /* --- 추가된 시작 화면 / 모달 스타일 --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 237, 202, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .card-box {
            background: #fffaf0;
            padding: 40px;
            border-radius: 19px 13px 22px 15px;
            box-shadow: 0 13px 0 #e2a39a, 0 24px 32px rgba(67, 57, 66, 0.18);
            width: min(400px, 90%);
            text-align: center;
        }

        .card-box h2 {
            color: #58639b;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .action-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            background: #ee7d76;
            border: 3px solid white;
            border-radius: 30px;
            box-shadow: 0 6px 0 #b75050, 0 10px 15px rgba(50, 44, 52, 0.2);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b75050, 0 5px 10px rgba(50, 44, 52, 0.2);
        }

        .action-btn:disabled {
            background: #ccc;
            box-shadow: 0 6px 0 #999;
            cursor: not-allowed;
        }

        .submit-wrap {
            text-align: center;
            margin-top: 50px;
        }

        /* ------------------------------------- */

        .story-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .story-card {
            --accent: #ee7d76;
            --accent-dark: #b75050;
            --paper-depth: #e2a39a;

            position: relative;
            min-width: 0;
            padding: 32px 24px 28px;
            background: #fffaf0;
            border-radius: 19px 13px 22px 15px;
            box-shadow:
                0 13px 0 var(--paper-depth),
                0 24px 32px rgba(67, 57, 66, 0.18);
            transition: 0.2s;
        }

        .story-card:hover {
            transform: translateY(-4px) rotate(-0.2deg);
        }

        .story-card:nth-child(2) {
            --accent: #69ad92;
            --accent-dark: #39775f;
            --paper-depth: #9ac6b4;
        }

        .story-card:nth-child(3) {
            --accent: #8b82bd;
            --accent-dark: #5b548d;
            --paper-depth: #b7afd3;
        }

        .number {
            position: absolute;
            top: -22px;
            left: 22px;
            z-index: 2;
            display: grid;
            width: 58px;
            height: 58px;
            place-items: center;
            color: white;
            font-size: 32px;
            font-weight: 900;
            background: var(--accent);
            border-radius: 52% 46% 55% 43%;
            box-shadow:
                0 7px 0 var(--accent-dark),
                0 11px 15px rgba(62, 54, 66, 0.22);
            transform: rotate(-5deg);
        }

        .photo-frame {
            position: relative;
            height: 300px;
            overflow: hidden;
            color: var(--accent-dark);
            background:
                linear-gradient(45deg,
                    rgba(255, 255, 255, 0.6),
                    transparent),
                #f2e8dc;
            border: 8px solid white;
            border-radius: 13px 9px 14px 11px;
            box-shadow:
                0 5px 0 #e4dcc7,
                inset 0 0 0 2px rgba(68, 58, 68, 0.08);
        }

        .photo-preview {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-photo {
            display: flex;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
        }

        .photo-icon {
            display: grid;
            width: 64px;
            height: 64px;
            place-items: center;
            color: white;
            font-size: 32px;
            background: var(--accent);
            border-radius: 46% 54% 45% 55%;
            box-shadow: 0 6px 0 var(--accent-dark);
            transform: rotate(-3deg);
        }

        .empty-photo strong {
            font-size: 19px;
        }

        .empty-photo small {
            color: #736b79;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            position: absolute;
            right: 14px;
            bottom: 14px;
            padding: 10px 17px;
            color: white;
            font-weight: 900;
            background: var(--accent);
            border: 2px solid white;
            border-radius: 30px;
            box-shadow:
                0 4px 0 var(--accent-dark),
                0 7px 12px rgba(50, 44, 52, 0.2);
            cursor: pointer;
        }

        .upload-button:hover {
            background: var(--accent-dark);
        }

        .input-list {
            display: grid;
            gap: 13px;
            margin-top: 22px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 88px 1fr;
            align-items: center;
            gap: 10px;
        }

        .input-label {
            display: grid;
            min-height: 44px;
            place-items: center;
            color: white;
            font-size: 14px;
            font-weight: 900;
            background: var(--accent);
            border-radius: 8px 11px 7px 10px;
            box-shadow: 0 4px 0 var(--accent-dark);
            transform: rotate(-1deg);
        }

        .input-row input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            color: #3f3a4b;
            font-size: 15px;
            font-weight: 700;
            background: #fffef9;
            border: 2px dashed var(--accent);
            border-radius: 8px 12px 8px 11px;
            outline: none;
        }

        .input-row input:focus {
            border-style: solid;
            box-shadow: 0 0 0 4px rgba(120, 110, 160, 0.15);
        }

        .input-row input::placeholder {
            color: #9d9399;
        }

        @media (max-width: 1000px) {
            .story-grid {
                grid-template-columns: 1fr;
            }

            .story-card {
                width: min(680px, 100%);
                margin: 0 auto;
            }
        }

        @media (max-width: 520px) {
            .page {
                padding: 28px 14px 50px;
            }

            h1 {
                padding: 15px 20px;
                letter-spacing: -2px;
            }

            .guide {
                font-size: 14px;
            }

            .story-card {
                padding: 30px 16px 24px;
            }

            .photo-frame {
                height: 245px;
            }

            .input-row {
                grid-template-columns: 76px 1fr;
            }

            .input-label {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="sun" aria-hidden="true"></div>
        <div class="hill hill-left" aria-hidden="true"></div>
        <div class="hill hill-right" aria-hidden="true"></div>

        <!-- 1. 첫 페이지 (개인정보 입력 화면) -->
        <div id="startScreen" class="overlay">
            <div class="card-box">
                <h2 style="color: #ee7d76;">내 정보 입력하기</h2>
                <div class="input-list" style="--accent: #ee7d76; --accent-dark: #b75050;">
                    <label class="input-row">
                        <span class="input-label">번호</span>
                        <input type="number" id="studentNum" placeholder="번호를 입력하세요">
                    </label>
                    <label class="input-row">
                        <span class="input-label">이름</span>
                        <input type="text" id="studentName" placeholder="이름을 입력하세요">
                    </label>
                </div>
                <button id="startBtn" class="action-btn">시작하기</button>
            </div>
        </div>

        <!-- 2. 본 화면 -->
        <div class="container" id="mainApp" style="display: none;">
            <header>
                <h1>내가 가장 좋아하는 하루</h1>
                <p class="guide">
                    사진 3장을 골라 그날의 이야기를 들려주세요!
                </p>
            </header>

            <section class="story-grid" id="storyGrid"></section>

            <div class="submit-wrap">
                <button id="submitBtn" class="action-btn"
                    style="background:#69ad92; box-shadow:0 6px 0 #39775f;">제출하기</button>
            </div>
        </div>

        <!-- 3. 수고했어요 메시지 모달 -->
        <div id="successModal" class="overlay" style="display: none;">
            <div class="card-box" style="box-shadow: 0 13px 0 #9ac6b4, 0 24px 32px rgba(67, 57, 66, 0.18);">
                <h2 style="color: #69ad92;">수고하셨습니다! 🎉</h2>
                <p>선생님께 성공적으로 제출되었습니다.<br>이제 창을 닫으셔도 좋습니다.</p>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 🚨 선생님 설정 안내: 
        // 아래 SCRIPT_URL에 선생님의 구글 앱스 스크립트 웹앱 URL을 붙여넣어 주세요!
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyc5hdqiN1I21Is07GN0wBTz_nu2P01uokbgJkbd3iAyz6iRlkJxXe4mf-Piim7M5usoQ/exec";

        // 요소 가져오기
        const startScreen = document.getElementById("startScreen");
        const mainApp = document.getElementById("mainApp");
        const successModal = document.getElementById("successModal");

        const startBtn = document.getElementById("startBtn");
        const submitBtn = document.getElementById("submitBtn");

        const studentNumInput = document.getElementById("studentNum");
        const studentNameInput = document.getElementById("studentName");

        const storyGrid = document.getElementById("storyGrid");

        // 시작 버튼 이벤트
        startBtn.addEventListener("click", () => {
            if (!studentNumInput.value.trim() || !studentNameInput.value.trim()) {
                alert("번호와 이름을 모두 입력해주세요!");
                return;
            }
            startScreen.style.display = "none";
            mainApp.style.display = "block";
        });

        /* 사진 카드 3개 생성 */
        for (let index = 1; index <= 3; index++) {
            const card = document.createElement("article");
            card.className = "story-card";
            card.innerHTML = `
        <div class="number">${index}</div>
        <div class="photo-frame">
          <img id="preview-${index}" class="photo-preview" alt="${index}번째 선택한 사진">
          <div id="empty-${index}" class="empty-photo">
            <div class="photo-icon">＋</div>
            <div>
              <strong>사진을 올려요</strong><br>
              <small>눌러서 사진 고르기</small>
            </div>
          </div>
          <input id="file-${index}" class="file-input" type="file" accept="image/*">
          <label class="upload-button" for="file-${index}" id="button-${index}">사진 선택</label>
        </div>
        <div class="input-list">
          <label class="input-row">
            <span class="input-label">등장인물</span>
            <input type="text" placeholder="누구와 함께했나요?" aria-label="${index}번째 사진 등장인물">
          </label>
          <label class="input-row">
            <span class="input-label">언제</span>
            <input type="text" placeholder="언제였나요?" aria-label="${index}번째 사진 시간">
          </label>
          <label class="input-row">
            <span class="input-label">하는 일</span>
            <input type="text" placeholder="무엇을 하고 있나요?" aria-label="${index}번째 사진 하는 일">
          </label>
        </div>
      `;
            storyGrid.appendChild(card);

            const fileInput = document.getElementById(`file-${index}`);
            const preview = document.getElementById(`preview-${index}`);
            const emptyPhoto = document.getElementById(`empty-${index}`);
            const button = document.getElementById(`button-${index}`);

            fileInput.addEventListener("change", function () {
                const file = fileInput.files[0];
                if (!file) return;

                const imageURL = URL.createObjectURL(file);
                preview.src = imageURL;
                preview.style.display = "block";
                emptyPhoto.style.display = "none";
                button.textContent = "사진 바꾸기";
            });
        }

        // 제출 버튼 이벤트
        submitBtn.addEventListener("click", () => {
            const num = studentNumInput.value.trim();
            const name = studentNameInput.value.trim();

            if (!num || !name) {
                alert("번호와 이름을 다시 확인해주세요.");
                return;
            }

            // 모든 칸이 채워져 있는지 간단히 확인 (선택사항이지만 꼼꼼한 제출을 위해)
            const allInputs = storyGrid.querySelectorAll('input[type="text"]');
            let isAllFilled = true;
            allInputs.forEach(input => {
                if (!input.value.trim()) isAllFilled = false;
            });

            if (!isAllFilled) {
                const proceed = confirm("아직 채워지지 않은 칸이 있습니다. 그래도 제출하시겠습니까?");
                if (!proceed) return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "제출 중...";

            // 구글 앱스 스크립트로 데이터 전송 (폼 데이터 방식)
            const formData = new URLSearchParams();
            formData.append("number", num);
            formData.append("name", name);

            // 3개의 카드 입력값 수집
            allInputs.forEach((input, i) => {
                const cardIndex = Math.floor(i / 3) + 1; // 1, 2, 3
                const typeIndex = i % 3; // 0: 등장인물, 1: 언제, 2: 하는 일

                let fieldName = "";
                if (typeIndex === 0) fieldName = `person${cardIndex}`;
                else if (typeIndex === 1) fieldName = `when${cardIndex}`;
                else if (typeIndex === 2) fieldName = `action${cardIndex}`;

                formData.append(fieldName, input.value.trim());
            });

            if (SCRIPT_URL === "여기에_구글스크립트_URL을_붙여넣으세요") {
                // 선생님이 URL을 설정하지 않은 경우 (테스트 모드)
                alert("선생님이 구글 시트 URL을 아직 설정하지 않았습니다. (테스트 성공!)");
                submitBtn.disabled = false;
                submitBtn.textContent = "제출하기";
                successModal.style.display = "flex";
                return;
            }

            fetch(SCRIPT_URL, {
                method: "POST",
                body: formData,
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                }
            })
                .then(response => {
                    successModal.style.display = "flex";
                })
                .catch(error => {
                    alert("제출 중 오류가 발생했습니다. 다시 시도해주세요.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "제출하기";
                });
        });
    </script>
</body>

</html>
